  type: "official-documentation"
  evidence_type: "primary-source"
  notes: >
    Fonte primária sobre responsabilidade profissional com uso de GenAI:
    mantém obrigações de competência, confidencialidade, comunicação,
    supervisão, veracidade e cobrança razoável. Discute explicitamente
    que um advogado não pode faturar o tempo que uma tarefa teria levado
    sem IA quando o trabalho efetivamente consumiu menos tempo.
