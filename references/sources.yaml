    Ensaio pessoal do autor a partir de sua experiência com agentes de IA
    escrevendo código; usar como interpretação do autor, não fato
    estabelecido. Também atribui a popularização do termo "cognitive debt"
    a Margaret-Anne Storey e Simon Willison, sem afirmar autoria exclusiva
    de nenhum dos dois.
  url: "https://www.geoffreylitt.com/2026/07/02/understanding-is-the-new-bottleneck"
