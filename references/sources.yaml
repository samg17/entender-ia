- id: storey-2026-cognitive-debt
  title: "Cognitive Debt"
  authors:
    - "Margaret-Anne Storey"
  type: "article"
  evidence_type: "author-analysis"
  notes: >
    A própria autora trata "dívida cognitiva" como um termo em circulação
    crescente, não como algo que ela reivindica ter cunhado sozinha. Define
    o conceito como erosão do entendimento compartilhado e da capacidade de
    explicar e modificar um sistema — distinto de dívida técnica, que é
    sobre o sistema, não sobre o entendimento das pessoas envolvidas.
  url: "https://margaretstorey.com/blog/2026/02/09/cognitive-debt/"
  published: "2026-02-09"
  accessed: "2026-09-29"

