  type: "research"
  evidence_type: "survey"
  notes: >
    Pesquisa com mais de 1.500 profissionais de legal, tax, accounting,
    risk, fraud e government. Usada para: IA já incorporada a workflows
    profissionais; apenas 18% das organizações pesquisadas dizem medir
    ROI de IA; dois terços dos respondentes corporativos querem que suas
    firmas externas usem IA, embora menos de 20% exijam isso
    formalmente.
