  notes: >
    Pesquisa com mais de 1.800 profissionais em 62 países. Usada para
    mudanças em desenvolvimento profissional, papéis, retenção e
    expectativas de clientes.
  url: "https://www.thomsonreuters.com/en/institute/reports/future-of-professionals-2026"
