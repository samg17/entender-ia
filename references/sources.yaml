  organization: "Thomson Reuters"
  type: "research"
  evidence_type: "survey"
  notes: >
    Recorte jurídico da mesma pesquisa. Usada especificamente para
    pressão sobre billing: 71% dos profissionais jurídicos internos
    pesquisados esperam que firmas externas mudem modelos comerciais à
    medida que o uso de IA aumenta, enquanto apenas 28% das firmas dizem
    já ter alterado suas estruturas de pricing — evidência de pressão
    sobre o modelo, não de "fim da hora faturável".
